<div class="modal-backdrop" *ngIf="executive" (click)="onBackdropClick($event)">
  <div class="modal-panel">
    <div class="modal-header">
      <button *ngIf="selectedClient" class="back-btn" (click)="clearSelection()" aria-label="Volver">
        &#8592; Volver
      </button>
      <div class="modal-header-info">
        <h2 class="modal-title">{{ executive.name }}</h2>
        <span *ngIf="executive.squad" class="modal-squad">{{ executive.squad }}</span>
      </div>
      <div class="modal-stats">
        <span class="modal-stat">
          <strong>{{ executive.clientCount }}</strong> clientes
        </span>
        <span class="modal-stat active">
          <strong>{{ executive.activeCount }}</strong> activos
        </span>
      </div>
      <button class="modal-close" (click)="close()" aria-label="Cerrar">&times;</button>
    </div>

    <div class="modal-body">

      <!-- Grid de tarjetas -->
      <div *ngIf="!selectedClient" class="clients-grid">
        <div
          class="client-card"
          *ngFor="let client of executive.clients"
          (click)="selectClient(client)"
          [class.is-active]="isActive(client)"
        >
          <span class="client-card-name">{{ getBusinessName(client) }}</span>
          <span *ngIf="statusKey" class="client-card-status" [class.active]="isActive(client)">
            {{ client[statusKey] ?? '—' }}
          </span>
        </div>
      </div>

      <!-- Detalle del cliente seleccionado -->
      <div *ngIf="selectedClient" class="client-detail">
        <h3 class="detail-title">{{ getBusinessName(selectedClient) }}</h3>
        <div class="detail-grid">
          <div class="detail-field" *ngFor="let key of clientKeys">
            <span class="detail-label">{{ key }}</span>
            <span class="detail-value">{{ selectedClient[key] ?? '—' }}</span>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
