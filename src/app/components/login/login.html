<div class="login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <img class="login-logo" src="logo.png" alt="Vamos Bien" width="56" height="56" />
      <h1 class="login-title">Gestión Ejecutivos</h1>
      <p class="login-subtitle">Iniciá sesión para continuar</p>
    </div>

    <form (ngSubmit)="submit()">
      <label class="login-field">
        <span>Email</span>
        <div class="login-input-wrap">
          <svg class="login-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 6.5l8.4 6 8.6-6M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input type="email" name="email" [(ngModel)]="email" autocomplete="username" placeholder="tu@email.com" required />
        </div>
      </label>

      <label class="login-field">
        <span>Contraseña</span>
        <div class="login-input-wrap">
          <svg class="login-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="4" y="10" width="16" height="10" rx="2" stroke-linejoin="round"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" autocomplete="current-password" placeholder="••••••••" required />
          <button type="button" class="login-toggle-pass" (click)="showPassword = !showPassword" tabindex="-1">
            {{ showPassword ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
      </label>

      <p class="login-error" *ngIf="error">{{ error }}</p>

      <button type="submit" class="login-submit" [disabled]="loading">
        <span class="login-spinner" *ngIf="loading"></span>
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <div class="login-divider"><span>o</span></div>

    <button
      type="button"
      class="login-facebook"
      [disabled]="facebookLoading"
      (click)="loginWithFacebook()"
    >
      <span class="login-spinner" *ngIf="facebookLoading"></span>
      <svg *ngIf="!facebookLoading" class="login-facebook-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.89h2.78l-.44 2.91h-2.34V22c4.78-.76 8.44-4.92 8.44-9.94Z"/>
      </svg>
      {{ facebookLoading ? 'Conectando...' : 'Continuar con Meta' }}
    </button>
  </div>
</div>
