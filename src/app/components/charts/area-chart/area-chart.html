<svg [attr.viewBox]="viewBox" class="area-chart-svg" preserveAspectRatio="none">
  <defs>
    <linearGradient [attr.id]="gradId" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" [attr.stop-color]="color" stop-opacity="0.32" />
      <stop offset="100%" [attr.stop-color]="color" stop-opacity="0" />
    </linearGradient>
  </defs>
  <line class="month-grid-line" *ngFor="let x of gridX" [attr.x1]="x" [attr.x2]="x" [attr.y1]="gridTop" [attr.y2]="gridBottom" />
  <path [attr.d]="areaPath" [attr.fill]="gradFill" />
  <path [attr.d]="linePath" fill="none" [attr.stroke]="color" stroke-width="2.25" stroke-linecap="round"
    stroke-linejoin="round" />
  <circle [attr.cx]="lastPoint[0]" [attr.cy]="lastPoint[1]" r="3.5" [attr.fill]="color" />

  <!-- Objetivo a futuro: guía punteada a la altura de la meta (para comparar
       con la curva real) y un punto + etiqueta en la columna reservada. -->
  <g *ngIf="goal as g" class="goal-marker">
    <line class="goal-guide" [attr.x1]="chartLeft" [attr.x2]="chartRight" [attr.y1]="goalY" [attr.y2]="goalY" />
    <circle class="goal-dot" [attr.cx]="goalX" [attr.cy]="goalY" r="4.5" />
    <text
      class="goal-label"
      [attr.x]="goalX - 6"
      [attr.y]="goalLabelBelow ? goalY + 16 : goalY - 8"
      text-anchor="end"
    >🎯 {{ g.value }} · {{ g.monthLabel }}</text>
  </g>
</svg>
