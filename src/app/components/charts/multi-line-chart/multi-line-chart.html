<div class="multi-line-chart-wrap">
  <svg
    #svgEl
    [attr.viewBox]="viewBox"
    class="multi-line-chart-svg"
    preserveAspectRatio="none"
    (mousemove)="onMouseMove($event)"
    (mouseleave)="onMouseLeave()"
  >
    <line
      class="month-grid-line"
      *ngFor="let x of monthGridX"
      [attr.x1]="x" [attr.x2]="x" [attr.y1]="chartTop" [attr.y2]="chartBottom"
    />
    <g *ngFor="let s of series; let i = index">
      <path
        [attr.d]="linePath(s.data)"
        fill="none"
        [attr.stroke]="s.color"
        [attr.stroke-width]="hoveredIndex === i ? 3 : 2.25"
        [class.is-dimmed]="isDimmed(i)"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle
        [attr.cx]="lastPoint(s.data)[0]"
        [attr.cy]="lastPoint(s.data)[1]"
        r="3"
        [attr.fill]="s.color"
        [class.is-dimmed]="isDimmed(i)"
      />
    </g>
    <circle
      *ngIf="hoveredSeries as hs"
      class="hover-dot"
      [attr.cx]="pointAt(hs.data, hoveredPointIndex)[0]"
      [attr.cy]="pointAt(hs.data, hoveredPointIndex)[1]"
      r="4.5"
      [attr.fill]="hs.color"
    />

    <!-- Objetivo a futuro: guía punteada a la altura de la meta (para comparar
         con las líneas reales) y un punto + etiqueta en la columna reservada. -->
    <g *ngIf="goal as g" class="goal-marker">
      <line class="goal-guide" [attr.x1]="chartLeft" [attr.x2]="chartRight" [attr.y1]="goalY" [attr.y2]="goalY" />
      <circle class="goal-dot" [attr.cx]="goalX" [attr.cy]="goalY" r="4.5" />
      <text
        class="goal-label"
        [attr.x]="goalX - 6"
        [attr.y]="goalLabelBelow ? goalY + 16 : goalY - 8"
        text-anchor="end"
      >{{ g.value }} · {{ g.monthLabel }}</text>
    </g>
  </svg>

  <div
    *ngIf="hoveredSeries as hs"
    class="chart-tooltip"
    [style.left.%]="tooltipLeftPct"
    [style.top.%]="tooltipTopPct"
  >
    <span class="chart-tooltip-dot" [style.background]="hs.color"></span>
    <strong>{{ hs.label }}</strong>
    <span *ngIf="hoveredMonthLabel" class="chart-tooltip-detail">
      {{ hoveredMonthLabel }} · {{ hoveredValue }} cliente{{ hoveredValue === 1 ? '' : 's' }}
    </span>
  </div>
</div>
