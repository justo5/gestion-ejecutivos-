<ul class="detail-client-list" *ngIf="list.length; else noClientRows">
  <li class="detail-client-row" *ngFor="let c of list">
    <app-status-dot [status]="c.status"></app-status-dot>
    <span class="detail-client-name" [attr.title]="c.name">{{ c.name }}</span>
    <span class="detail-client-exec">{{ c.executiveName }}</span>
    <span class="detail-client-secondary">{{ c.secondary }}</span>
  </li>
</ul>
<ng-template #noClientRows><p class="bars-empty">{{ emptyText }}</p></ng-template>
