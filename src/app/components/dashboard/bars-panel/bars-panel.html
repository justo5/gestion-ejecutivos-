<div class="bars-panel" [class.is-clickable]="dim" [attr.role]="dim ? 'button' : null" [attr.tabindex]="dim ? 0 : null"
  (click)="onOpen()" (keydown.enter)="onOpen()" (keydown.space)="onOpen()">
  <div class="panel-header">{{ title }}</div>
  <div class="bar-rows" *ngIf="bars.length; else noBars">
    <div class="bar-row" *ngFor="let b of bars" [attr.title]="b.label + ': ' + b.secondary">
      <span class="bar-dot" [style.background]="b.color"></span>
      <span class="bar-label">{{ b.label }}</span>
      <span class="bar-track"><span class="bar-fill" [style.width.%]="b.pct" [style.background]="b.color"></span></span>
      <span class="bar-value">{{ b.secondary }}</span>
    </div>
  </div>
  <ng-template #noBars><p class="bars-empty">Sin datos suficientes.</p></ng-template>
</div>
