<div class="dashboard-page">
  <div class="dashboard-header">
    <h1 class="dashboard-title">Dashboard</h1>
  </div>

  <ng-container *ngIf="vm$ | async as vm">
    <ng-container *ngIf="vm.hasData; else emptyState">
      <app-dashboard-kpi-grid [vm]="vm" (cardOpen)="selectedCard = $event"></app-dashboard-kpi-grid>

      <app-dashboard-trend-grid [vm]="vm" (chartOpen)="selectedChart = $event"></app-dashboard-trend-grid>

      <!-- Crecimiento de TODA la empresa (todos los ejecutivos sumados), sin
           filtrar por rol: a diferencia del resto de los gráficos de este
           dashboard, cualquier ejecutivo ve el mismo dato acá, no solo su
           propia cartera. -->
      <app-dashboard-trend-panel
        *ngIf="vm.generalGrowth.length"
        class="general-growth-panel"
        title="Crecimiento general de clientes · últimos 12 meses"
        color="#9085e9"
        label="dashboard-general"
        [data]="vm.generalGrowth"
        [currentLabel]="vm.generalGrowth[vm.generalGrowth.length - 1] + ' clientes en total'"
        [rangeLabel]="vm.monthLabels[vm.monthLabels.length - 1]"
        [goal]="vm.generalGoal"
      ></app-dashboard-trend-panel>

      <app-dashboard-executive-growth-panel
        *ngIf="vm.executiveGrowth.length"
        [series]="vm.executiveGrowth"
        [monthLabels]="vm.monthLabels"
        [goal]="vm.executiveGoal"
      ></app-dashboard-executive-growth-panel>

      <app-dashboard-distribution-grid [vm]="vm" (barsOpen)="selectedBars = $event"></app-dashboard-distribution-grid>

      <!-- Detalle de tarjeta KPI -->
      <app-dashboard-card-modal *ngIf="selectedCard" [card]="selectedCard" [vm]="vm"
        (dismiss)="selectedCard = null"></app-dashboard-card-modal>

      <!-- Detalle de panel de barras (semáforo, rubro, plan, ejecutivo, país, sexo) -->
      <app-dashboard-bars-modal *ngIf="selectedBars" [dim]="selectedBars" [vm]="vm"
        (dismiss)="selectedBars = null"></app-dashboard-bars-modal>

      <!-- Detalle de gráfico de tendencia (cartera cobrada, clientes nuevos, bajas) -->
      <app-dashboard-chart-modal *ngIf="selectedChart" [chart]="selectedChart" [vm]="vm"
        (dismiss)="selectedChart = null"></app-dashboard-chart-modal>
    </ng-container>

    <ng-template #emptyState>
      <p class="empty-state">Todavía no hay clientes cargados para mostrar analíticas.</p>
    </ng-template>
  </ng-container>
</div>
