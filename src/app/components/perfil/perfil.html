<section class="perfil-page">
  <h2>Perfil</h2>

  <div class="perfil-card" *ngIf="profile">
    <div class="perfil-avatar">
      <img *ngIf="myImageUrl" [src]="myImageUrl" [alt]="profile.name" class="perfil-avatar-img" />
      <ng-container *ngIf="!myImageUrl">{{ getInitials() }}</ng-container>
      <label *ngIf="profile.executiveId" class="perfil-avatar-upload" title="Cambiar foto">
        <span aria-hidden="true">+</span>
        <input type="file" accept="image/*" (change)="onImageSelected($event)" hidden />
      </label>
    </div>

    <div class="perfil-field">
      <span>Nombre</span>
      <p>{{ profile.name }}</p>
    </div>

    <div class="perfil-field">
      <span>Email</span>
      <p>{{ profile.email }}</p>
    </div>

    <div class="perfil-field">
      <span>Rol</span>
      <p>{{ roleLabel() }}</p>
    </div>

    <div class="perfil-actions">
      <button type="button" class="save-btn" (click)="logout()">Cerrar sesión</button>
    </div>
  </div>
</section>
