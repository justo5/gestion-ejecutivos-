services:
  gestion-juniors:
    build:
      context: .
    container_name: gestion-juniors
    restart: unless-stopped
    # Sin puertos: entra solo por nginx-proxy-manager (npm_network).
    # gestion-ejecutivos-net hace falta para el proxy /api -> backend:3000.
    networks:
      - npm_network
      - gestion-ejecutivos-net

networks:
  npm_network:
    external: true
    name: mi-red-nginx
  gestion-ejecutivos-net:
    external: true
